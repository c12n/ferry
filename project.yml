name: Tether
options:
  bundleIdPrefix: com.c12n
  deploymentTarget:
    iOS: "17.0"
  # Builds the WireGuard server (Go) into WireGuard/build/TetherWG.xcframework. Skips when unchanged.
  preGenCommand: scripts/build-wireguard.sh
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # The app's bundle ID. Pass APP_BUNDLE_ID to xcodebuild to change it.
    APP_BUNDLE_ID: com.c12n.tether
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "1" # the built app gets the commit count instead, see postBuildScripts
targets:
  Tether:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - framework: WireGuard/build/TetherWG.xcframework
        embed: false # a static library, linked into the app
      - target: TetherWidgets
        embed: true
    # The App Group carries the widget snapshot. After a third-party re-sign it may not
    # resolve; the app and widget both cope (see WidgetSnapshot.swift).
    entitlements:
      path: Sources/Tether.entitlements
      properties:
        com.apple.security.application-groups: [group.com.c12n.tether]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ferry
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Ferry accepts connections from your devices on the hotspot network.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # The build number is the commit count, so each build on the iPhone can be told apart
    # (Settings > General > iPhone Storage > Ferry). It runs before Xcode signs the app.
    postBuildScripts:
      - name: Build number from git
        basedOnDependencyAnalysis: false
        # The processed Info.plist as input makes it wait for Xcode to write that file.
        # Without it the two can run in parallel, and Xcode overwrites the number.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git -C "$SRCROOT" rev-list --count HEAD)" \
            "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  # The widget + Live Activity extension. The shared files (the activity's shape, the
  # widget snapshot, the text formats) are compiled into it as well as the app.
  TetherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/TetherActivityAttributes.swift
      - Sources/WidgetSnapshot.swift
      - Sources/Format.swift
    entitlements:
      path: Widgets/TetherWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.c12n.tether]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c12n.tether.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Ferry Widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ferry Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  TetherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Tether
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.c12n.tether.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tether:
    build:
      targets:
        Tether: all
        TetherWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [TetherUITests]
